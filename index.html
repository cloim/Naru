<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#163d35"/><title>Naru</title><link rel="icon" type="image/png" sizes="32x32" href="/brand/naru-icon-32.png?v=20261021"/><link rel="icon" type="image/png" sizes="64x64" href="/brand/naru-icon-64.png?v=20261021"/><link rel="apple-touch-icon" href="/brand/naru-mark.png?v=20261017c"/>
<style>
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#163d35;color:#c7d6ce;font-family:Bahnschrift,"Segoe UI",sans-serif}
#boot .box{display:flex;flex-direction:column;align-items:center;gap:20px}
#boot .mark{font-size:44px;letter-spacing:.02em;color:#eef8e4}
#boot .bar{width:160px;height:3px;border-radius:3px;background:#ffffff1f;overflow:hidden}
#boot .bar::after{content:"";display:block;width:40%;height:100%;border-radius:3px;background:#d4efae;animation:boot-run 1.2s ease-in-out infinite}
#boot .text{font-size:13px}
#boot-debug{font-size:12px;color:#facc15;max-width:320px;word-break:break-all;text-align:center;min-height:18px}
@keyframes boot-run{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#boot .bar::after{animation:none;width:100%;opacity:.6}}
</style>
<script>
window.__setBootStatus = function(msg, isError) {
  var el = document.getElementById('boot-debug');
  if (el) {
    el.innerText = msg;
    if (isError) el.style.color = '#f87171';
  }
};
window.addEventListener('error', function(e) {
  window.__setBootStatus('오류: ' + (e.message || e), true);
});
window.addEventListener('unhandledrejection', function(e) {
  var r = e.reason;
  window.__setBootStatus('비동기 오류: ' + (r && (r.message || r.error) ? (r.message || r.error) : r), true);
});
</script>
</head><body><div id="root"><div id="boot" role="status" aria-label="Naru"><div class="box"><div class="mark">Naru</div><div class="bar"></div><div class="text">Naru를 준비하는 중</div><div id="boot-debug">브라우저 스크립트 로딩 중...</div></div></div></div><script type="module" src="/src/main.jsx"></script></body></html>

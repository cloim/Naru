[workspace]
resolver = "2"
members = ["crates/agent"]
# The agent only builds for x86_64-unknown-linux-musl: cargo build -p naru-agent --target x86_64-unknown-linux-musl.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"

[profile.release.package.naru-agent]
opt-level = "s"

